<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typotheque - Chairman</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <header class="navbar">
        <a href="#" class="logo">TYPOTHEQUE</a>

        <button class="menu-button" aria-label="Menu">
            ☰
        </button>

        <div class="nav-right">
            <a href="#">Log In</a>
            <button class="search-button" aria-label="Zoeken">
                ⌕
            </button>
        </div>
    </header>



    <main>

        <section class="hero">
            <img src="chairman.png" alt="Chairman">class="hero-image">
        </section>



        <section class="font-grid">


            <article class="font-card all-fonts">
                <h2>All Fonts</h2>

                <img src="Oranje groot links.png" alt="Oranje afbeelding links">
            </article>



            <article class="font-card global-fonts">
                <h2>Global Fonts</h2>

               <img src="Zwart + regenboog copy.png" alt="Zwart met regenboog">
            </article>



            <article class="font-card variable-fonts">
                <h2>Variable Fonts</h2>

                <img src="Lichtroze AAAAA.png" alt="Lichtroze afbeelding">
            </article>


            <article class="font-card smart-fonts">
                <h2>Smart Fonts</h2>

               <img src="Blauwe TT.png" alt="Blauwe TT">
            </article>



            <article class="font-card superfamilies">
                <h2>Superfamilies</h2>

             <img src="Licht blauwe vormen.png" alt="Lichtblauwe vormen">
            </article>



            <article class="font-card legibility-fonts">
                <h2>Legibility Fonts</h2>

             <img src="Bruine 1Ji.png" alt="Bruine 1Ji">
            </article>



            <article class="font-card optical-sizes">
                <h2>Optical Sizes</h2>

                <img src="Oranje AAA de goede.png" alt="Oranje afbeelding">
            </article>

        </section>

    </main>

</body>

</html>
